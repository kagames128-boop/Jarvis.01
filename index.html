<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050608"><link rel="manifest" href="manifest.json"><title>JARVIS 2.0</title><style>
body{margin:0;background:#050608;color:#f5f5f5;font-family:Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:28px 18px}.brand{text-align:center;letter-spacing:10px;font-size:42px;font-weight:bold}.sub{text-align:center;color:#f33;letter-spacing:4px}.orb{width:230px;height:230px;border:2px solid #e00000;border-radius:50%;margin:55px auto 35px;display:grid;place-items:center;box-shadow:0 0 40px #9008,inset 0 0 45px #6008}.core{width:32px;height:32px;border:4px solid white;border-radius:50%}.status{background:#10141a;border-radius:22px;padding:22px;min-height:150px;white-space:pre-wrap;line-height:1.55}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.btn{border:0;border-radius:18px;padding:20px;background:#d00000;color:white;font-size:18px;font-weight:bold}textarea{width:100%;margin-top:16px;background:#0b0c0f;color:white;border:2px solid #34383e;border-radius:18px;padding:18px;font-size:17px;min-height:75px;box-sizing:border-box}.send{width:100%;margin-top:14px}.small{text-align:center;color:#9da3ad;font-size:12px;margin-top:16px}</style></head><body><div class="wrap">
<div class="brand">JARVIS</div><div class="sub">SISTEMAS ONLINE • V2</div><div class="orb"><div class="core"></div></div>
<div class="status" id="status">Olá. Sistemas iniciados.\n\nEstou pronto para conversar.</div>
<div class="row"><button class="btn" id="talk">🎙️ FALAR</button><button class="btn" id="repeat">🔊 REPETIR</button></div>
<textarea id="input" placeholder="Digite um comando..."></textarea><button class="btn send" id="send">ENVIAR</button>
<div class="small">JARVIS 2.0 • chave da IA protegida no servidor</div></div>
<script>
const BACKEND_URL=localStorage.getItem("jarvis_backend_url")||"COLOQUE_A_URL_DO_BACKEND_AQUI";let last="";
const s=document.getElementById("status"),i=document.getElementById("input");
function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";u.rate=.98;u.pitch=.9;speechSynthesis.speak(u)}}
async function ask(t){t=t.trim();if(!t)return;if(BACKEND_URL.includes("COLOQUE_A_URL")){s.textContent="O cérebro de IA ainda não foi conectado.\n\nConfigure a URL do backend.";return}s.textContent="JARVIS está processando...";try{let r=await fetch(BACKEND_URL.replace(/\/$/,"")+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t})});let d=await r.json();if(!r.ok)throw Error(d.error||"Erro no servidor");last=d.answer||"Sem resposta.";s.textContent="Você: "+t+"\n\nJARVIS: "+last;speak(last)}catch(e){s.textContent="JARVIS: "+e.message+"\n\nVerifique o backend."}}
send.onclick=()=>ask(i.value);i.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(i.value)}};repeat.onclick=()=>last&&speak(last);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){let r=new SR();r.lang="pt-BR";r.onresult=e=>{i.value=e.results[0][0].transcript;ask(i.value)};talk.onclick=()=>{s.textContent="Estou ouvindo...";r.start()}}else talk.onclick=()=>s.textContent="Reconhecimento de voz não disponível neste navegador.";
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
